# Alembic-Konfiguration des PTI-Pseudonymisierers.
#
# Bewusst KEIN `sqlalchemy.url` hier: Die Datenbank-URL kommt aus derselben
# Quelle wie in der Anwendung (`backend.db.get_database_url`, also
# `backend.config.Settings.database_url` bzw. `DATABASE_URL`). Stuende sie hier
# zusaetzlich, gaebe es zwei Wahrheiten — und die in dieser Datei traegt in
# Produktion ein Passwort, das nicht ins Repository gehoert.
#
# Aufruf immer aus dem Repository-Wurzelverzeichnis:
#
#     python -m alembic current        # welche Revision traegt die Datenbank?
#     python -m alembic upgrade head   # NUR auf einer LEEREN Datenbank
#     python -m alembic stamp head     # bestehende Datenbank auf die Basis stempeln
#
# Fuer den Stempel-Schritt in Produktion gibt es `scripts/alembic_stempeln.py`:
# Es prueft vorher, ob der Zustand ueberhaupt stempelbar ist, statt blind zu
# schreiben. Siehe dessen Modul-Docstring und CLAUDE.md, Abschnitt
# „Schemaaenderungen".

[alembic]
script_location = migrations

# Damit `backend.…` importierbar ist, wenn Alembic aus der Repo-Wurzel laeuft.
prepend_sys_path = .
# Ohne diese Zeile warnt Alembic 1.19 und faellt auf das alte Trennverhalten
# zurueck (Leerzeichen, Komma, Doppelpunkt) — auf einem Windows-Pfad mit
# Laufwerksbuchstaben zerlegte das den Eintrag an der falschen Stelle.
path_separator = os

# Zeitzonenlose Dateinamen mit Datumspraefix: Die Reihenfolge der Dateien im
# Verzeichnis entspricht damit der Reihenfolge der Migrationen — ohne dass man
# die `down_revision`-Kette lesen muss.
file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(rev)s_%%(slug)s

# ── Protokoll ──────────────────────────────────────────────────────────────
# Gilt nur fuer den CLI-Aufruf (`env.py` konfiguriert es ausschliesslich, wenn
# Alembic mit dieser Datei gestartet wurde). Der `alembic`-Logger steht auf
# INFO, damit „Running upgrade …" und „Stamping …" ueberhaupt sichtbar sind —
# ohne Behandler faellt Python auf `lastResort` zurueck und zeigt nur WARNING
# und hoeher. Genau dieser Stolperstein ist am 2026-08-25 in der Anwendung
# schon einmal zugeschnappt (siehe `backend.main.richte_protokoll_ein`).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
