# Scharfschaltet die Doctests in backend/core und backend/adapters (z.B.
# kennungen.als_uuid, adapters.get_adapter, ooxml.make_qn, pptx_adapter._resolve).
# Ohne diese Datei liefen sie nirgends: kein pytest.ini, kein setup.cfg, kein
# [tool.pytest.ini_options] existierte im Repo, bevor diese Datei angelegt wurde.
#
# Bewusst NICHT in pyproject.toml (root) — die gehoert Upstream, siehe
# Verzeichnis-Konvention in CLAUDE.md; wir haben sie nie geaendert
# (`git log --oneline -- pyproject.toml` zeigt nur Presidio-eigene Commits).
#
# Bewusst NICHT als root-level pytest.ini/conftest.py — pytest sucht die
# Config von den uebergebenen Pfaden aufwaerts. Eine Config im Repo-Root wuerde
# auch gefunden, wenn jemand `pytest` innerhalb von presidio-analyzer/ oder
# presidio-anonymizer/ aufruft (deren eigene pyproject.toml hat keinen
# [tool.pytest.ini_options]-Abschnitt, die Suche liefe also bis zum Root
# weiter) — und dort auf "backend/core" zeigen, das es dort nicht gibt.
# Gemessen: mit einer Config im Repo-Root bricht `cd presidio-analyzer &&
# pytest` mit "file or directory not found: backend/core" ab, obwohl
# presidio-analyzer sein eigenes vollstaendiges Testverzeichnis hat. Eine
# Datei hier in backend/ wird nur gefunden, wenn ein Aufruf tatsaechlich
# etwas unterhalb von backend/ einsammelt — nie bei einem auf
# presidio-analyzer/presidio-anonymizer beschraenkten Aufruf.
[pytest]
addopts = --doctest-modules backend/core backend/adapters
